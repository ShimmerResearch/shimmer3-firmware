# https://github.com/marketplace/actions/clang-format-lint
name: clang-format-lint

on: [push]

jobs:
  # Named for what it does. It was `build`, which made the checks list read as
  # though the firmware was being compiled - this job only runs clang-format.
  # It also collided with the `build` job in build-release-firmware.yml.
  format:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # To get working on on: [pull_request], uncomment the following
    # https://github.com/EndBug/add-and-commit#working-with-prs
 #     with:
 #       repository: ${{ github.event.pull_request.head.repo.full_name }}
 #       ref: ${{ github.event.pull_request.head.ref }}
    - name: Read the exclusion list
      # .clang-format-exclude is the only place the list lives; this turns it
      # into the fnmatch patterns the action wants. Adding a vendor directory
      # means editing that file and nothing else.
      id: excl
      run: |
        echo "source=$(scripts/clang-format-exclude.sh --source-root)" >> "$GITHUB_OUTPUT"
        echo "globs=$(scripts/clang-format-exclude.sh --globs)" >> "$GITHUB_OUTPUT"

    - uses: DoozyX/clang-format-lint-action@v0.17
      with:
        source: './${{ steps.excl.outputs.source }}'
        exclude: ${{ steps.excl.outputs.globs }}
        extensions: 'h,c'
        clangFormatVersion: 17
        inplace: True
        style: file
    - uses: EndBug/add-and-commit@v9
      with:
        # Determines the way the action fills missing author name and email. Three options are available:
        # - github_actor -> UserName <UserName@users.noreply.github.com>
        # - user_info -> Your Display Name <your-actual@email.com>
        # - github_actions -> github-actions <email associated with the github logo>
        # Default: github_actor
        default_author: github_actions
        message: 'Committing clang-format changes'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
