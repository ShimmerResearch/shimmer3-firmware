name: LogAndStream_Shimmer3 Build & Release

# Publishes a release CANDIDATE: a GitHub pre-release on a new tag, with the
# image and build-info.json. Customers are not offered it until it has been
# tested and promote-release.yml has passed the release gate - see
# log-and-stream-common docs/SHIMMER3_RELEASE_AND_VERSIONING.md §7.

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:
    inputs:
      increment:
        description: "Which version part to increment (vMAJOR.MINOR.PATCH)?"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch
      # Releases ship from Debug (-O0). Release is -O2 --opt_for_speed=2, the DEV-1217
      # candidate, and ships only once it has passed the bench procedure - see
      # log-and-stream-common docs/SHIMMER3_BUILD_AND_PROGRAMMING.md §4.2.
      build_mode:
        description: "Build configuration (releases ship from Debug):"
        required: true
        default: "Debug"
        type: choice
        options:
          - Release
          - Debug
      dry_run:
        description: "Dry run: build and upload the image as an artifact only - no commit, tag, release or Jira change"
        required: false
        default: false
        type: boolean

permissions:
  contents: write  # Needed for git commit/push and tag creation

env:
  PROJECT_NAME: LogAndStream_Shimmer3
  PROJECT_DIR: LogAndStream_Shimmer3
  BUILD_CONFIG: ${{ github.event.inputs.build_mode }}
  TAG_PREFIX: LogAndStream_Shimmer3_v
  JIRA_VERSION_PREFIX: 'L&S_S3_v'   # note the quotes due to &
  CCS_VERSION: 12.8.1.00005
  CCS_TAR: CCS12.8.1.00005_linux-x64.tar.gz
  CCS_INSTALL_DIR: /opt/ti/ccs
  SUBMODULE_FOLDER: log-and-stream-common
  SUBMODULE_REPO: ShimmerResearch/log-and-stream-common

# One release build at a time: two concurrent runs would read the same
# version.txt and bump, tag and publish the same version.
# GitHub holds one run waiting behind the running one; a third dispatch
# replaces the waiting run, which then shows as cancelled in Actions.
# Start the next run only after the last has finished.
concurrency:
  group: build-release-firmware
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # BUILD_CONFIG comes from the build_mode input. It reaches shell scripts
      # only as that variable, and nothing but the two configurations runs.
      - name: Check the build configuration
        run: |
          case "$BUILD_CONFIG" in
            Release|Debug) ;;
            *) echo "::error::build_mode must be Release or Debug"; exit 1 ;;
          esac

      # A candidate is a version bump committed to a branch, then tagged. Run
      # from a tag or any other ref there is no branch to commit the bump to,
      # so the tag would name a commit still carrying the old version.txt,
      # which promote-release.yml refuses. A dry run commits nothing, so it may.
      # The ref is a user's choice, so it reaches the shell only as a variable.
      - name: Refuse a ref that is not a branch
        if: ${{ github.ref_type != 'branch' && !inputs.dry_run }}
        run: |
          echo "::error::Run this from a branch: $GITHUB_REF is not one, so the version bump could not be committed before tagging."
          exit 1

      # Only the shipping configuration is ever promoted (promote-release.yml,
      # SHIPPING_CONFIG). A candidate built from the other would take a version
      # number and a tag and could never go public, so it is refused before
      # anything is bumped. A dry run of it publishes nothing, so it may.
      - name: Refuse a candidate from a configuration that does not ship
        if: ${{ inputs.build_mode != 'Debug' && !inputs.dry_run }}
        run: |
          echo "::error::Releases ship from Debug, and promote-release.yml promotes nothing else. Build Debug, or set dry_run to try the $BUILD_CONFIG build."
          exit 1

      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for tags and versioning
          submodules: recursive  # Ensures submodules are fetched
          ref: ${{ github.ref }}
        
      - name: Debug path
        run: pwd

      - name: Debug contents
        run: ls

      - name: Debug directory structure
        run: |
          ls -lR ${{ env.PROJECT_DIR }}/${{ env.SUBMODULE_FOLDER }}/scripts

      - name: Normalize line endings
        run: |
          sudo apt-get update
          sudo apt-get install -y dos2unix
          dos2unix '${{ env.PROJECT_DIR }}'/${{ env.SUBMODULE_FOLDER }}/scripts/*.sh || true

      # Before anything is bumped or tagged: a release must not be cut from a
      # commit whose shared library fails its own tests.
      - name: Host tests (log-and-stream-common at the pinned commit)
        run: make -C "${{ env.PROJECT_DIR }}/${{ env.SUBMODULE_FOLDER }}/Test/host" platform-check test

      - name: Increment version
        env:
          INCREMENT: ${{ inputs.increment || 'patch' }}
        run: |
          set -euo pipefail
          # The input reaches the shell only as a variable, and only these three.
          case "$INCREMENT" in
            major|minor|patch) inc="$INCREMENT" ;;
            *) echo "::error::increment must be major, minor or patch"; exit 1 ;;
          esac
          chmod +x '${{ env.PROJECT_DIR }}/${{ env.SUBMODULE_FOLDER }}/scripts/increment_version.sh'
          '${{ env.PROJECT_DIR }}/${{ env.SUBMODULE_FOLDER }}/scripts/increment_version.sh' "$inc"

      - name: Save version for next steps
        id: get_version
        run: |
          set -euo pipefail
          VERSION=$(cat "${{ env.PROJECT_DIR }}/build/version.txt")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install prerequisites
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y wget xz-utils libusb-1.0-0 \
            libxext6 libxrender1 libxtst6 libxi6 libglib2.0-0 libgtk2.0-0 libnss3 ca-certificates \
            tar gzip coreutils findutils libtinfo5
          #rm -rf /var/lib/apt/lists/*

      - name: Cache CCS
        id: ccs-cache
        uses: actions/cache@v4
        with:
            # use the absolute install dir directly
          path: ${{ env.CCS_INSTALL_DIR }}
          key: ccs-${{ env.CCS_VERSION }}

      - name: Download CCS (if cache miss)
        if: steps.ccs-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          URL="https://dr-download.ti.com/software-development/ide-configuration-compiler-or-debugger/MD-J1VdearkvK/12.8.1/CCS${CCS_VERSION}_linux-x64.tar.gz"
          echo "Downloading: $URL"
          wget -q "$URL" -O /tmp/ccs.tar.gz
          ls -l /tmp/ccs.tar.gz
            SIZE=$(stat -c%s /tmp/ccs.tar.gz)
          echo "Archive size: $SIZE bytes"
          [ "$SIZE" -gt 500000000 ] || { echo "Archive too small"; exit 1; }
          mkdir -p /tmp/ccs
          tar -xzf /tmp/ccs.tar.gz -C /tmp/ccs
          echo "Validate archive (first 10 entries):"
           #Avoid SIGPIPE by using sed instead of head
          tar -tzf /tmp/ccs.tar.gz | sed -n '1,10p'
          echo "Top-level extracted:"

      - name: Inspect extracted installer
        if: steps.ccs-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          INSTALLER_DIR=$(find /tmp/ccs -maxdepth 1 -type d -name "CCS${CCS_VERSION}_linux-x64")
          [ -n "$INSTALLER_DIR" ] || { echo "Installer dir not found"; exit 1; }
          find "$INSTALLER_DIR" -maxdepth 2 -type f -printf '%P (%k KB)\n' | head -n 40 || true
          INSTALLER="$INSTALLER_DIR/ccs_setup_${CCS_VERSION}.run"
          [ -f "$INSTALLER" ] || { echo "Installer binary missing"; exit 1; }
          chmod +x "$INSTALLER"
          file "$INSTALLER"

      - name: Install CCS unattended
        if: steps.ccs-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          set -x
          mkdir -p /opt/ti
          INSTALLER=$(find /tmp/ccs -maxdepth 4 -type f -name "ccs_setup_*.run" | head -n1)
          test -n "$INSTALLER"
          chmod +x "$INSTALLER"
          #"$INSTALLER" --help | sed -n '1,120p' || true
          PREFIX=/opt/ti/ccs
          # Choose components: remove --enable-components to install defaults
          # Example enables only MSP430; adjust as needed.
          "$INSTALLER" \
            --mode unattended \
            --unattendedmodeui none \
            --prefix "$PREFIX" \
            --enable-components PF_MSP430 \
            --debuglevel 4
          INSTALL_RC=${INSTALL_RC:-0}
          echo "Installer exit code: $INSTALL_RC"
          if [ $INSTALL_RC -ne 0 ] || [ ! -d "$PREFIX" ]; then
            exit 1
          fi
          echo "Install tree depth 3:"
          find "$PREFIX" -maxdepth 3 -type d -print
      
      - name: Locate Eclipse
        id: loc
        run: |
          set -euo pipefail
          if [ -x "${CCS_INSTALL_DIR}/eclipse/eclipse" ]; then
            E="${CCS_INSTALL_DIR}/eclipse/eclipse"
          elif [ -x "${CCS_INSTALL_DIR}/ccs/eclipse/eclipse" ]; then
            E="${CCS_INSTALL_DIR}/ccs/eclipse/eclipse"
          else
            echo "Eclipse not found:"
            find "${CCS_INSTALL_DIR}" -maxdepth 5 -name eclipse -print || true
            exit 1
          fi
          echo "eclipse_bin=$E" >> "$GITHUB_OUTPUT"
          "$E" -noSplash -application com.ti.ccstudio.apps.projectBuild -help | head -n 20 || true

      - name: Verify CCS
        run: |
          set -euo pipefail
          "${{ steps.loc.outputs.eclipse_bin }}" -noSplash -application com.ti.ccstudio.apps.projectBuild -help | head -n 15 || true

      - name: Cache imported workspace (optional)
        id: ws-cache
        uses: actions/cache@v4
        with:
          path: ccs_workspace
          key: ccs-ws-${{ env.CCS_VERSION }}-${{ hashFiles('**/.project') }}

      - name: Import project (if workspace cache miss)
        if: steps.ws-cache.outputs.cache-hit != 'true'
        run: |
          "${{ steps.loc.outputs.eclipse_bin }}" \
            -noSplash \
            -data "${GITHUB_WORKSPACE}/ccs_workspace" \
            -application com.ti.ccstudio.apps.projectImport \
            -ccs.location "${GITHUB_WORKSPACE}/${PROJECT_NAME}"

      - name: Build project
        run: |
          "${{ steps.loc.outputs.eclipse_bin }}" \
            -noSplash \
            -data "${GITHUB_WORKSPACE}/ccs_workspace" \
            -application com.ti.ccstudio.apps.projectBuild \
            -ccs.projects "${PROJECT_NAME}" \
            -ccs.configuration "${BUILD_CONFIG}" \
            -ccs.cleanBuild

      - name: Collect TI TXT
        run: |
          set -euo pipefail
          mkdir -p build
          TXT=$(find '${{ env.PROJECT_DIR }}' -type f -path "*/$BUILD_CONFIG/*.txt" | head -n1 || true)
          [ -z "$TXT" ] && { echo "No txt produced"; exit 1; }
          cp "$TXT" "build/${{ env.TAG_PREFIX }}${{ steps.get_version.outputs.version }}.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          overwrite: true  # a re-run uploads under the same name
          name: "${{ env.TAG_PREFIX }}${{ steps.get_version.outputs.version }}"
          path: |
            ${{ env.PROJECT_DIR }}/${{ env.BUILD_CONFIG }}/*.out
            build/*.txt
            Debug/*.txt
            Release/*.txt

      - name: Commit version bump
        if: ${{ github.ref_type == 'branch' && !inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "${{ env.PROJECT_DIR }}/build/version.txt" "${{ env.PROJECT_DIR }}/Shimmer_Driver/version.h"
          git commit -m "chore: bump firmware version to v${{ steps.get_version.outputs.version }}" || echo "No changes to commit"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"

      - name: Create Git tag
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "${{ env.TAG_PREFIX }}${{ steps.get_version.outputs.version }}"
          git push origin "${{ env.TAG_PREFIX }}${{ steps.get_version.outputs.version }}"

      - name: Stop here on a dry run
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Dry run: v${{ steps.get_version.outputs.version }} built, nothing published"
            echo ""
            echo "The image is in this run's artifacts. No commit, tag, release or Jira change was made."
          } >> "$GITHUB_STEP_SUMMARY"

      # What a tester needs to bind a report to this build: the commit the tag
      # points at (reports must name it exactly), the shared-library commit,
      # and the image hash so a flashed unit can be traced back to this file.
      - name: Write build-info.json
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          IMG="build/${{ env.TAG_PREFIX }}${{ steps.get_version.outputs.version }}.txt"
          jq -n \
            --arg platform shimmer3 \
            --arg tag "${{ env.TAG_PREFIX }}${{ steps.get_version.outputs.version }}" \
            --arg version "${{ steps.get_version.outputs.version }}" \
            --arg commit "$(git rev-parse HEAD)" \
            --arg submodule_commit "$(git -C '${{ env.PROJECT_DIR }}/${{ env.SUBMODULE_FOLDER }}' rev-parse HEAD)" \
            --arg build_mode "$BUILD_CONFIG" \
            --arg image "$(basename "$IMG")" \
            --arg image_sha256 "$(sha256sum "$IMG" | cut -d' ' -f1)" \
            --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{schema: "shimmer-build-info/1", platform: $platform, tag: $tag, firmware_version: $version,
              commit: $commit, submodule_commit: $submodule_commit, build_mode: $build_mode,
              image: $image, image_sha256: $image_sha256, workflow_run: $run}' \
            > build/build-info.json
          cat build/build-info.json

      - name: Create GitHub pre-release (release candidate)
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_PREFIX }}${{ steps.get_version.outputs.version }}
          name: "${{ env.TAG_PREFIX }}${{ steps.get_version.outputs.version }}"
          prerelease: true
          generate_release_notes: true
          body: |
            **Release candidate - not yet tested.** It becomes a full release when its test reports are attached and `promote-release.yml` passes the release gate.
          files: |
            build/*.txt
            build/build-info.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Link main repo issues to Jira issues. The fix version is created
      # unreleased; promote-release.yml marks it released.
      - name: Link GitHub release to Jira
        if: ${{ !inputs.dry_run }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: DEV
          GH_TAG_PREFIX: ${{ env.TAG_PREFIX }}
          JIRA_VERSION_PREFIX: ${{ env.JIRA_VERSION_PREFIX }}
        run: |
          set -euo pipefail
          VERSION='${{ steps.get_version.outputs.version }}'
          RELEASE_TAG="${GH_TAG_PREFIX}${VERSION}"
          JIRA_VERSION="${JIRA_VERSION_PREFIX}${VERSION}"

          git fetch --tags --quiet || true

          PREV_TAG=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || echo "")
          RANGE=$([ -n "$PREV_TAG" ] && echo "$PREV_TAG..$RELEASE_TAG" || echo "$RELEASE_TAG")

          ISSUE_KEYS=$(git log --format='%s%n%b' $RANGE | grep -Eo '[A-Z][A-Z0-9]+-[0-9]+' | sort -u || true)

          # -f: an HTTP error must stop here, not read as "no such version".
          PROJECT_JSON=$(curl -fsS -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            -H 'Accept: application/json' "$JIRA_BASE_URL/rest/api/3/project/$JIRA_PROJECT_KEY")
          PROJECT_ID=$(echo "$PROJECT_JSON" | jq -r '.id // empty')
          [ -z "$PROJECT_ID" ] && echo "Failed to resolve project id" && echo "$PROJECT_JSON" && exit 1

          VERSIONS_JSON=$(curl -fsS -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            -H 'Accept: application/json' "$JIRA_BASE_URL/rest/api/3/project/$JIRA_PROJECT_KEY/versions")
          # Unpaginated: every version, as an array. Anything else is an error.
          echo "$VERSIONS_JSON" | jq -e 'type == "array"' >/dev/null \
            || { echo "Unexpected Jira versions response"; echo "$VERSIONS_JSON"; exit 1; }

          # Normalize to an array, then pick the first matching version id (if any)
          EXISTING_VERSION_ID=$(echo "$VERSIONS_JSON" | jq -r --arg NAME "$JIRA_VERSION" '
            (.values? // .)                                     # paginated object or bare array
            | (if type=="array" then . else [] end)             # ensure array
            | map(select(.name==$NAME)) | .[0]? | .id? // empty # select by name
          ')

          if [ -z "$EXISTING_VERSION_ID" ]; then
            CREATE_RESP=$(jq -nc --arg name "$JIRA_VERSION" --arg pid "$PROJECT_ID" --arg date "$(date -u +%Y-%m-%d)" \
              '{name:$name, projectId:($pid|tonumber), released:false, releaseDate:$date}' \
              | curl -s -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" -H 'Content-Type: application/json' \
                -d @- "$JIRA_BASE_URL/rest/api/3/version")
            VERSION_ID=$(echo "$CREATE_RESP" | jq -r '.id // empty')
            [ -z "$VERSION_ID" ] && echo "Failed to create Jira version" && echo "$CREATE_RESP" && exit 1
          else
            VERSION_ID="$EXISTING_VERSION_ID"
          fi

          # The version exists now, keys or not, so promote-release.yml finds the
          # candidate's version unreleased. Only the linking needs issue keys.
          if [ -z "$ISSUE_KEYS" ]; then
            echo "No Jira issue keys found; nothing to link."
            exit 0
          fi

          while read -r KEY; do
            [ -z "$KEY" ] && continue
            curl -s -o /dev/null -w "%{http_code}\n" \
              -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
              -H 'Content-Type: application/json' \
              -X PUT \
              --data "$(jq -nc --arg v "$JIRA_VERSION" '{update:{fixVersions:[{add:{name:$v}}]}}')" \
              "$JIRA_BASE_URL/rest/api/3/issue/$KEY" | grep -qE '^(204|200)$' || echo "Failed to update $KEY"
          done <<< "$ISSUE_KEYS"

      # Create tag and release in submodule
      - name: Remove actions auth header
        if: ${{ !inputs.dry_run }}
        run: |
          git config --unset-all http.https://github.com/.extraheader || true
          git -C '${{ env.PROJECT_DIR }}/${{ env.SUBMODULE_FOLDER }}' config --unset-all http.https://github.com/.extraheader || true

      - name: Prepare submodule remote with PAT
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          SUB_PATH='${{ env.PROJECT_DIR }}/${{ env.SUBMODULE_FOLDER }}'
          # Safety: remove any lingering auth header
          git -C "$SUB_PATH" config --unset-all http.https://github.com/.extraheader || true
          # Set remote URL with PAT
          git -C "$SUB_PATH" remote set-url origin "https://${{ secrets.SUBMODULE_PUSH_USER }}:${{ secrets.SUBMODULE_PUSH_TOKEN }}@github.com/${{ env.SUBMODULE_REPO }}.git"
          git -C "$SUB_PATH" remote -v
      
      - name: Tag submodule ${{ env.SUBMODULE_FOLDER }}
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ env.PROJECT_DIR }}/${{ env.SUBMODULE_FOLDER }}
        run: |
          set -euo pipefail
          tag='${{ env.TAG_PREFIX }}${{ steps.get_version.outputs.version }}'
          git fetch --tags origin
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists. Skipping."
            exit 0
          fi
          git config user.name "${{ secrets.SUBMODULE_PUSH_USER }}"
          git config user.email "${{ secrets.SUBMODULE_PUSH_USER }}@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          # Push via explicit URL (ensures PAT is used even if remote not rewritten)
          git push "https://${{ secrets.SUBMODULE_PUSH_USER }}:${{ secrets.SUBMODULE_PUSH_TOKEN }}@github.com/${{ env.SUBMODULE_REPO }}.git" "$tag"

      - name: Create GitHub Release in submodule
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_PUSH_TOKEN }}
          TAG: ${{ env.TAG_PREFIX }}${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "${{ env.SUBMODULE_REPO }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists in $SUBMODULE_REPO; skipping."
          else
            # Add files (e.g., `build/*.txt`) after "$TAG" if you want to attach assets
            gh release create "$TAG" -R "${{ env.SUBMODULE_REPO }}" --title "$TAG" --generate-notes --prerelease
          fi

      # Link submodule repo issues to Jira issues
      - name: Link GitHub release to Jira
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ env.PROJECT_DIR }}/${{ env.SUBMODULE_FOLDER }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: DEV
          GH_TAG_PREFIX: ${{ env.TAG_PREFIX }}
          JIRA_VERSION_PREFIX: ${{ env.JIRA_VERSION_PREFIX }}
        run: |
          set -euo pipefail
          VERSION='${{ steps.get_version.outputs.version }}'
          RELEASE_TAG="${GH_TAG_PREFIX}${VERSION}"
          JIRA_VERSION="${JIRA_VERSION_PREFIX}${VERSION}"

          git fetch --tags --quiet || true

          PREV_TAG=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || echo "")
          RANGE=$([ -n "$PREV_TAG" ] && echo "$PREV_TAG..$RELEASE_TAG" || echo "$RELEASE_TAG")

          ISSUE_KEYS=$(git log --format='%s%n%b' $RANGE | grep -Eo '[A-Z][A-Z0-9]+-[0-9]+' | sort -u || true)

          # -f: an HTTP error must stop here, not read as "no such version".
          PROJECT_JSON=$(curl -fsS -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            -H 'Accept: application/json' "$JIRA_BASE_URL/rest/api/3/project/$JIRA_PROJECT_KEY")
          PROJECT_ID=$(echo "$PROJECT_JSON" | jq -r '.id // empty')
          [ -z "$PROJECT_ID" ] && echo "Failed to resolve project id" && echo "$PROJECT_JSON" && exit 1

          VERSIONS_JSON=$(curl -fsS -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            -H 'Accept: application/json' "$JIRA_BASE_URL/rest/api/3/project/$JIRA_PROJECT_KEY/versions")
          # Unpaginated: every version, as an array. Anything else is an error.
          echo "$VERSIONS_JSON" | jq -e 'type == "array"' >/dev/null \
            || { echo "Unexpected Jira versions response"; echo "$VERSIONS_JSON"; exit 1; }

          # Normalize to an array, then pick the first matching version id (if any)
          EXISTING_VERSION_ID=$(echo "$VERSIONS_JSON" | jq -r --arg NAME "$JIRA_VERSION" '
            (.values? // .)                                     # paginated object or bare array
            | (if type=="array" then . else [] end)             # ensure array
            | map(select(.name==$NAME)) | .[0]? | .id? // empty # select by name
          ')

          if [ -z "$EXISTING_VERSION_ID" ]; then
            CREATE_RESP=$(jq -nc --arg name "$JIRA_VERSION" --arg pid "$PROJECT_ID" --arg date "$(date -u +%Y-%m-%d)" \
              '{name:$name, projectId:($pid|tonumber), released:false, releaseDate:$date}' \
              | curl -s -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" -H 'Content-Type: application/json' \
                -d @- "$JIRA_BASE_URL/rest/api/3/version")
            VERSION_ID=$(echo "$CREATE_RESP" | jq -r '.id // empty')
            [ -z "$VERSION_ID" ] && echo "Failed to create Jira version" && echo "$CREATE_RESP" && exit 1
          else
            VERSION_ID="$EXISTING_VERSION_ID"
          fi

          # The version exists now, keys or not, so promote-release.yml finds the
          # candidate's version unreleased. Only the linking needs issue keys.
          if [ -z "$ISSUE_KEYS" ]; then
            echo "No Jira issue keys found; nothing to link."
            exit 0
          fi

          while read -r KEY; do
            [ -z "$KEY" ] && continue
            curl -s -o /dev/null -w "%{http_code}\n" \
              -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
              -H 'Content-Type: application/json' \
              -X PUT \
              --data "$(jq -nc --arg v "$JIRA_VERSION" '{update:{fixVersions:[{add:{name:$v}}]}}')" \
              "$JIRA_BASE_URL/rest/api/3/issue/$KEY" | grep -qE '^(204|200)$' || echo "Failed to update $KEY"
          done <<< "$ISSUE_KEYS"

